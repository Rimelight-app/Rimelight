# The app ID is ClearPlay's on purpose: the Windows installer finds the
# installed copy by it and updates it in place (same taskbar pins too).
# Don't change it. main/index.ts sets the same ID as AppUserModelId.
appId: com.tonihk00.clearplay
productName: Rimelight
copyright: Copyright © 2026 tonihk00. Based on Aonsoku, Copyright © 2026 Victor Alves (MIT)
icon: ./build/icon.ico
artifactName: '${productName}-v${version}-${os}-${arch}.${ext}'

directories:
  buildResources: build

files:
  - '!**/*'
  - 'out/**'
  - '!out/renderer/screenshots{,/**}'
  - 'package.json'
  - 'LICENSE.txt'
  - 'NOTICE.md'
  - 'licenses/**'

extraResources:
  - from: resources
    to: resources

win:
  executableName: Rimelight
  target:
    - target: nsis
      arch:
        - x64

nsis:
  shortcutName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  license: ./LICENSE.txt
  uninstallerIcon: ./build/icon.ico

linux:
  icon: ./build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
  maintainer: tonihk00
  category: AudioVideo
  synopsis: 'A frosted-glass desktop player for Navidrome (OpenSubsonic) servers.'
  description: 'Rimelight is a minimal desktop music player for self-hosted Navidrome and OpenSubsonic servers.'
  executableName: rimelight
  desktop:
    entry:
      Name: Rimelight
      StartupWMClass: Rimelight
      Keywords: music;player;navidrome;subsonic;

# Up to 0.6.1 the package was called clearplay. Installing rimelight
# replaces it instead of installing a second copy next to it.
deb:
  fpm:
    - '--replaces=clearplay'
    - '--conflicts=clearplay'

rpm:
  fpm:
    - '--rpm-rpmbuild-define=_build_id_links none'
    - '--replaces=clearplay'

npmRebuild: true
nativeRebuilder: legacy

publish:
  provider: github
  owner: Rimelight-app
  repo: Rimelight
