appId: com.tonihk00.clearplay
productName: ClearPlay
copyright: Copyright © 2026 tonihk00. Based on Aonsoku, Copyright © 2026 Victor Alves (MIT)
icon: ./build/icon.ico
artifactName: '${productName}-v${version}-${os}-${arch}.${ext}'

directories:
  buildResources: build

files:
  - '!**/*'
  - 'out/**'
  - '!out/renderer/screenshots{,/**}'
  - 'package.json'
  - 'LICENSE.txt'
  - 'NOTICE.md'

extraResources:
  - from: resources
    to: resources

win:
  executableName: ClearPlay
  target:
    - target: nsis
      arch:
        - x64

nsis:
  shortcutName: ${productName}
  oneClick: false
  allowToChangeInstallationDirectory: true
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  license: ./LICENSE.txt
  uninstallerIcon: ./build/icon.ico

linux:
  icon: ./build/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: tonihk00
  category: AudioVideo
  synopsis: 'A frosted-glass desktop player for Navidrome (OpenSubsonic) servers.'

npmRebuild: true
nativeRebuilder: legacy

publish:
  provider: github
  owner: tonihk00
  repo: ClearPlay
