name: Symfonium

# Builds the ClearPlay icon pack APK and publishes it, together with the
# Symfonium theme and application style, on the rolling "symfonium" release.
on:
  push:
    branches: [main]
    paths:
      - 'symfonium-iconpack/**'
      - 'themes/symfonium/**'
      - '.github/workflows/symfonium.yml'
  workflow_dispatch:

concurrency:
  group: symfonium
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  iconpack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symfonium-iconpack
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../ClearPlay-Icons-Symfonium.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ClearPlay-Icons-Symfonium
          path: ClearPlay-Icons-Symfonium.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: symfonium
          target_commitish: ${{ github.sha }}
          name: ClearPlay for Symfonium (rolling)
          prerelease: true
          make_latest: false
          body: |
            Always the newest Symfonium files from `main`:
            - **ClearPlay-Icons-Symfonium.apk**: Lucide icon pack (Symfonium 16+). Install it, then choose
              Settings > Interface > Theme, icons, fonts and colors > Icon pack > ClearPlay (Lucide).
            - **ClearPlay-Glass-Style.json**: full application style. Install the icon pack first.
            - **ClearPlay-Glass.json**: colour theme only.
          files: |
            ClearPlay-Icons-Symfonium.apk
            themes/symfonium/ClearPlay-Glass.json
            themes/symfonium/ClearPlay-Glass-Style.json
