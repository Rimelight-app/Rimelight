name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            script: build:linux
            files: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm
              dist/latest-linux.yml
          - os: windows-2022
            name: windows
            script: build:win
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install rpm tooling (Fedora package)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: pnpm install --frozen-lockfile

      # Bit-perfect engine: the Windows installer ships mpv (Linux uses the
      # system's). Pinned version and checksum in the script.
      - name: Bundle mpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/fetch-mpv-windows.ps1

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Unit checks (bit-perfect decisions, ALSA parsers)
        run: node tools/dev-rig/bitperfect-unit.mjs

      - name: Unit checks (Now Playing reports)
        run: node tools/dev-rig/playback-report-unit.mjs

      - name: Compile main and renderer
        run: pnpm electron:build

      - name: Package
        run: pnpm ${{ matrix.script }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ClearPlay-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    # Publishes a GitHub release for the version in package.json, once per
    # version: on a v* tag, or on a push to main whose version has no tag yet.
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide release tag
        id: tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "Release ${TAG} already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.publish == 'true'
        with:
          path: release
          merge-multiple: true

      # GPL: every release that ships the Windows installer (with mpv) also
      # carries the exact source of that mpv build. The script checks the
      # shipped DLLs against its pinned sources and fails if they differ.
      - name: mpv source archive
        if: steps.tag.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash tools/fetch-mpv-source.sh "release/ClearPlay-${TAG}-mpv-source.tar.gz"

      # The release text is this version's CHANGELOG section. The app's
      # update dialog shows it when it offers the update.
      - name: Release notes from CHANGELOG
        if: steps.tag.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ClearPlay ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            release/*
          generate_release_notes: true
