name: Android

# Builds Rimelight for Android (android/; called ClearPlay for Android up to 1.6.0). Separate from the desktop build:
# runs only when android/** changes, and releases only on android-v* tags.
on:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)publish to the F-Droid repo, e.g. android-v1.6.1'
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            NAME="${GITHUB_REF#refs/tags/android-v}"
          else
            NAME="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Unit and screenshot tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Every release is signed with the same key (repository secrets) so a new
      # APK installs over the previous one; versionCode is the run number, which
      # always grows.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            # A release signed with any other key could not update the installed app.
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish an APK that cannot update earlier versions."
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; this test APK is debug-signed."
          fi

      - name: Build release APK
        env:
          CP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PcpVersionName="${{ steps.ver.outputs.name }}" \
            -PcpVersionCode="${{ steps.ver.outputs.code }}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Rimelight-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rimelight-android
          path: dist/*.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rimelight-android
          path: dist

      # The release text is this version's section of android/CHANGELOG.md.
      - name: Release notes
        working-directory: .
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' android/CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || echo "See android/CHANGELOG.md." > release-notes.md
          cat release-notes.md

      # make_latest: false keeps the desktop release as the repository's "latest",
      # which the desktop updater and the README badge read.
      - uses: softprops/action-gh-release@v2
        with:
          name: Rimelight for Android ${{ github.ref_name }}
          files: dist/*.apk
          body_path: release-notes.md
          make_latest: 'false'

  # Publishes the release APK to the project's own F-Droid repo (GitHub Pages, branch gh-pages).
  # Same APK, same signature as the GitHub release, so it updates in place over a GitHub install.
  # Needs two secrets: FDROID_KEYSTORE_BASE64 and FDROID_KEYSTORE_PASSWORD (the key that signs the
  # repo index, not the APK). Run by hand (Actions > Android > Run workflow, branch android, tag
  # input) to publish a release that already exists.
  fdroid-repo:
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fdroid-repo
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag and secrets
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          [[ "$TAG" == android-v* ]] || { echo "::error::'$TAG' is not an android-v* tag"; exit 1; }
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] || {
            echo "::error::FDROID_KEYSTORE_BASE64 / FDROID_KEYSTORE_PASSWORD are not set"; exit 1; }

      - name: Release APK
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/apks"
          ls -l "$RUNNER_TEMP/apks"

      - name: Current repo (branch gh-pages)
        run: |
          mkdir pages && cd pages
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin gh-pages; then git checkout -q -B gh-pages FETCH_HEAD; fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update the repo
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          pip install fdroidserver==2.4.6
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/repo.jks"
          PAGES="$PWD/pages" APKS="$RUNNER_TEMP/apks" KEYSTORE="$RUNNER_TEMP/repo.jks" \
            REPO_SLUG="$GITHUB_REPOSITORY" bash android/tools/fdroid/publish.sh
          rm -f "$RUNNER_TEMP/repo.jks"

      - name: Publish
        run: |
          cd pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "F-Droid repo: ${TAG}" || { echo "Nothing changed"; exit 0; }
          git push origin gh-pages
